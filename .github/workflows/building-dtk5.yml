# 构建 GXDE DTK5（含 Qt5 平台插件与主题集成）与基于其上的 DTK2 的 Arch 软件包（以及 Qt5 版本探针）
# 并推送到 GXDE Arch 源。
# DTK2 依赖 DTK5 core，因此在 DTK5 之后构建。全部成功推送后，再重建使用 Qt5 私有 API 的应用。
# -----------------------------------------------------------------------------
# Builds the GXDE DTK5 Arch packages (with the Qt 5 platform plugins and theme
# integration), the DTK2 stack built on top of it, and the Qt 5 version probe,
# then pushes them to the GXDE Arch repo.  DTK2 links against DTK5 core, so it
# comes after DTK5.  Once everything is pushed, the applications using Qt 5
# private API are rebuilt.

name: Building GXDE DTK5 And DTK2 Arch Packages
run-name: Building GXDE DTK5 And DTK2 Arch Packages

on:
  workflow_dispatch:
    inputs:
      dtk5common:
        description: dtk5common branch or tag
        default: master
      dtklog:
        description: dtklog branch or tag
        default: master
      dtk5core:
        description: dtk5core branch or tag
        default: master
      dtk5gui:
        description: dtk5gui branch or tag
        default: master
      dtk5widget:
        description: dtk5widget branch or tag
        default: master
      dtk2core:
        description: dtk2core branch or tag
        default: master
      gxde_qt_dbus_factory:
        description: gxde-qt-dbus-factory branch or tag
        default: master
      dtk2widget:
        description: dtk2widget branch or tag
        default: master
      gxde_qt5integration:
        description: gxde-qt5integration branch or tag
        default: master
      qt_probe:
        description: gxde-archpkg branch or tag for the Qt probe
        default: qt_version_probe
  # 供 Qt 版本巡检工作流调用 ・ Called by the Qt version watch workflow.
  workflow_call:
    inputs:
      dtk5common:
        description: dtk5common branch or tag
        type: string
        default: master
      dtklog:
        description: dtklog branch or tag
        type: string
        default: master
      dtk5core:
        description: dtk5core branch or tag
        type: string
        default: master
      dtk5gui:
        description: dtk5gui branch or tag
        type: string
        default: master
      dtk5widget:
        description: dtk5widget branch or tag
        type: string
        default: master
      dtk2core:
        description: dtk2core branch or tag
        type: string
        default: master
      gxde_qt_dbus_factory:
        description: gxde-qt-dbus-factory branch or tag
        type: string
        default: master
      dtk2widget:
        description: dtk2widget branch or tag
        type: string
        default: master
      gxde_qt5integration:
        description: gxde-qt5integration branch or tag
        type: string
        default: master
      qt_probe:
        description: gxde-archpkg branch or tag for the Qt probe
        type: string
        default: qt_version_probe

jobs:
  build:
    uses: ./.github/workflows/building-arch-batch.yml
    secrets: inherit
    with:
      name: dtk5
      # 构建顺序即依赖顺序；Qt 探针随 DTK5 一起重建，使其编译时 Qt 版本与 DTK5 一致，
      # 且只推送 gxde-arch-qt5-probe，以免影响另一个 Qt 主版本的巡检
      # Build order is dependency order.  The Qt probe is rebuilt alongside
      # DTK5 so its compile-time Qt matches the one DTK5 was built against,
      # and only gxde-arch-qt5-probe is pushed so the other Qt major's watch
      # is left alone.
      # workflow_dispatch 最多 10 个输入，Qt5 平台插件与主题集成固定使用 master；
      # 与 DTK6 相同，它们紧接在 DTK5 widget 之后构建
      # workflow_dispatch takes at most 10 inputs, so the Qt 5 platform plugins
      # and theme integration always build master.  As for DTK6, they follow
      # the DTK5 widget module.
      modules: >-
        dtk5common:${{ inputs.dtk5common }}
        dtklog:${{ inputs.dtklog }}
        dtk5core:${{ inputs.dtk5core }}
        dtk5gui:${{ inputs.dtk5gui }}
        dtk5widget:${{ inputs.dtk5widget }}
        dde-qt5platform-plugins:master
        dde-qt5integration:master
        dtk2core:${{ inputs.dtk2core }}
        gxde-qt-dbus-factory:${{ inputs.gxde_qt_dbus_factory }}
        dtk2widget:${{ inputs.dtk2widget }}
        gxde-qt5integration:${{ inputs.gxde_qt5integration }}
        gxde-archpkg:${{ inputs.qt_probe }}:gxde-arch-qt5-probe

  # 等 DTK5 与 DTK2 两个架构都推送成功后再开始，从 GXDE Arch 源取得刚发布的 DTK2
  # Starts only after DTK5 and DTK2 were pushed on both architectures, and
  # picks the fresh DTK2 up from the GXDE Arch repo.
  apps:
    needs: build
    uses: ./.github/workflows/building-arch-batch.yml
    secrets: inherit
    with:
      name: dtk5-apps
      # workflow_dispatch 最多 10 个输入，应用固定使用其 Arch 包所在的分支。deepin-clone 继承了
      # QAbstractFileEngine 等 Qt5 私有类，只在构建时的 Qt 版本下可靠，Qt5 升级后同样需要重建
      # workflow_dispatch takes at most 10 inputs, so the applications always
      # build the branch carrying their Arch package.  deepin-clone subclasses
      # QAbstractFileEngine and other private Qt 5 classes, which only hold for
      # the Qt release it was built against, so it is rebuilt on a Qt 5 update
      # too.
      modules: >-
        deepin-clone:master
