# 按依赖顺序在同一个 chroot 中构建 GXDE DTK5 的 Arch 软件包（以及 Qt5 版本探针）并推送到 GXDE Arch 源。
# 每个模块使用其仓库自带的 arch/PKGBUILD（或根目录 PKGBUILD），构建完成后立即安装，
# 供后续模块作为依赖使用。若源中已有相同版本，pkgrel 会自动提升。
# -----------------------------------------------------------------------------
# Builds the GXDE DTK5 Arch packages (plus the Qt 5 version probe) in
# dependency order inside one chroot and pushes them to the GXDE Arch repo.
# Each module is built from the arch/PKGBUILD (or root PKGBUILD) shipped in
# its own repository and installed right after, so later modules link against
# the fresh build.  pkgrel is bumped automatically when the repo already
# carries the same version.

name: Building GXDE DTK5 Arch Packages
run-name: Building GXDE DTK5 Arch Packages

on:
  workflow_dispatch:
    inputs:
      dtk5common:
        description: dtk5common branch or tag
        default: master
      dtklog:
        description: dtklog branch or tag
        default: master
      dtk5core:
        description: dtk5core branch or tag
        default: master
      dtk5gui:
        description: dtk5gui branch or tag
        default: master
      dtk5widget:
        description: dtk5widget branch or tag
        default: master
      qt_probe:
        description: gxde-archpkg branch or tag for the Qt probe
        default: qt_version_probe
  # 供 Qt 版本巡检工作流调用 ・ Called by the Qt version watch workflow.
  workflow_call:
    inputs:
      dtk5common:
        description: dtk5common branch or tag
        type: string
        default: master
      dtklog:
        description: dtklog branch or tag
        type: string
        default: master
      dtk5core:
        description: dtk5core branch or tag
        type: string
        default: master
      dtk5gui:
        description: dtk5gui branch or tag
        type: string
        default: master
      dtk5widget:
        description: dtk5widget branch or tag
        type: string
        default: master
      qt_probe:
        description: gxde-archpkg branch or tag for the Qt probe
        type: string
        default: qt_version_probe

env:
  REPOSITORY: https://github.com/GXDE-OS/GXDE
  ORGANIZATION: https://github.com/GXDE-OS
  BOTTLEPATH: system-bottle
  GXDE_ARCH_REPO: https://repo1.gxde.top/gxde-arch

jobs:
  build:
    if: github.repository_owner == 'GXDE-OS'
    name: ${{ matrix.arch }}-arch
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    env:
      # 构建顺序即依赖顺序；Qt 探针随 DTK5 一起重建，使其编译时 Qt 版本与 DTK5 一致
      # Build order is dependency order.  The Qt probe is rebuilt alongside
      # DTK5 so its compile-time Qt matches the one DTK5 was built against.
      MODULES: >-
        dtk5common:${{ inputs.dtk5common }}
        dtklog:${{ inputs.dtklog }}
        dtk5core:${{ inputs.dtk5core }}
        dtk5gui:${{ inputs.dtk5gui }}
        dtk5widget:${{ inputs.dtk5widget }}
        gxde-archpkg:${{ inputs.qt_probe }}
    steps:
      - name: Clone Repository To Get Script
        run: |
          git clone $REPOSITORY --depth=1
          mv $(basename $REPOSITORY)/* . -v
          mv $(basename $REPOSITORY)/.* . -v | true

      - name: Configure Base System
        run: |
          read -r first _ <<< "$MODULES"
          bash .github/workflows/configure-building-enviroment-arch.sh ${{ matrix.arch }} \
            $REPOSITORY \
            $ORGANIZATION/${first%%:*} \
            ${first#*:} \
            $GXDE_ARCH_REPO

      - name: Clone Modules
        run: |
          # 第一个模块已由环境配置脚本克隆 ・ The first module was cloned by the configure script.
          for module in ${MODULES#* }; do
            name=${module%%:*}
            sudo chroot $BOTTLEPATH sudo -H -u builder \
              git clone $ORGANIZATION/$name -b ${module#*:} /home/builder/$name
          done

      - name: Building DTK5
        run: |
          mkdir -p packages
          for module in $MODULES; do
            name=${module%%:*}
            repoPath=/home/builder/$name
            if [[ -f $BOTTLEPATH$repoPath/arch/PKGBUILD ]]; then
              buildPath=$repoPath/arch
            elif [[ -f $BOTTLEPATH$repoPath/PKGBUILD ]]; then
              buildPath=$repoPath
            else
              echo "::error::No PKGBUILD found in $name ($module)"
              exit 1
            fi
            echo "::group::$module"

            # 上游 PKGBUILD 的 pkgver 是写死的，若源中已有相同 pkgver，则将 pkgrel 提升为源中的值 +1，
            # 以便用户能通过 pacman 收到更新
            # The upstream PKGBUILDs pin pkgver, so when the GXDE repo already
            # has the same pkgver, bump pkgrel past the repo's one so pacman
            # picks the rebuild up as an upgrade.
            # 先运行 pkgver()，让 .SRCINFO 中是实际版本 ・ Run pkgver() first so .SRCINFO has the real version.
            read -r pkgname pkgver pkgrel < <(sudo chroot $BOTTLEPATH sudo -H -u builder bash -c \
              "cd $buildPath && makepkg -od --noprepare --noconfirm >&2 && makepkg --printsrcinfo" | awk -F' = ' '
                $1 == "pkgname" && !n { n = $2 }
                $1 == "\tpkgver" { v = $2 }
                $1 == "\tpkgrel" { r = $2 }
                END { print n, v, r }')
            remote=$(sudo chroot $BOTTLEPATH env LC_ALL=C pacman -Si gxde/$pkgname 2>/dev/null \
              | sed -n 's/^Version *: *//p')
            remoteVer=${remote#*:}
            remoteVer=${remoteVer%-*}
            remoteRel=${remote##*-}
            if [[ -n $remote && $remoteVer == "$pkgver" ]] && (( ${remoteRel%%.*} >= ${pkgrel%%.*} )); then
              newRel=$(( ${remoteRel%%.*} + 1 ))
              echo "$pkgname: repo has $remote, bumping pkgrel $pkgrel -> $newRel"
              sudo chroot $BOTTLEPATH sudo -H -u builder \
                sed -i "s/^pkgrel=.*/pkgrel=$newRel/" $buildPath/PKGBUILD
            else
              echo "$pkgname: repo has ${remote:-nothing}, keeping $pkgver-$pkgrel"
            fi

            sudo chroot $BOTTLEPATH sudo -H -u builder bash -c \
              "cd $buildPath && makepkg -si --noconfirm --needed"
            sudo find $BOTTLEPATH$buildPath -maxdepth 1 -name '*.pkg.tar.*' ! -name '*.sig' -exec cp -v {} packages/ \;
            echo "::endgroup::"
          done
          sudo chown -R $(id -u):$(id -g) packages
          ls -l packages

      - name: Remove Debug Package
        run: |
          rm -fv packages/*-debug-*.pkg.tar.*

      - name: Pack tar
        run: |
          cd packages
          tar -cvf ../arch-${{ matrix.arch }}-$(date +%s).tar *.pkg.tar.*

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dtk5-arch-${{ matrix.arch }}
          path: packages/*.pkg.tar.*

      - name: Push
        env:
          UPASSWD: ${{ secrets.PASSWD }}
          UUSERS: ${{ secrets.USERS }}
          UHOST: ${{ secrets.HOST }}
          UPATH: ${{ secrets.UPATH }}
          UPROGRAM_ARCH: ${{ secrets.UPROGRAM_ARCH }}
          UPORT: ${{ secrets.UPORT }}
        run: |
          if [[ -z "$UPROGRAM_ARCH" ]]; then
            echo "::warning::UPROGRAM_ARCH is not set, skip uploading Arch packages"
            exit 0
          fi
          sudo apt update
          sudo apt install sshpass -y
          mkdir -p ~/.ssh/
          ssh-keyscan -p $UPORT -H $UHOST >> ~/.ssh/known_hosts
          tarName=$(ls | grep '^arch-.*\.tar$' | head -n 1)
          sshpass -p "$UPASSWD" rsync -e "ssh -p $UPORT" $tarName $UUSERS@$UHOST:$UPATH
          sshpass -p "$UPASSWD" ssh $UUSERS@$UHOST -p $UPORT $UPROGRAM_ARCH ${{ matrix.arch }} $UPATH/$tarName > /dev/null
