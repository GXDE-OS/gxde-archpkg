# 构建 GXDE DTK6 与基于其上的 DTK2 Qt6 移植版的 Arch 软件包（以及 Qt6 版本探针）并推送到
# GXDE Arch 源。DTK2 Qt6 依赖 DTK6，因此在 DTK6 之后构建。
# dtkcommon-git 由 DTK5 批量构建提供，此处从 GXDE Arch 源安装。
# 全部成功推送后，再依次重建链接 DTK6 或使用 Qt6 私有 API 的应用。
# -----------------------------------------------------------------------------
# Builds the GXDE DTK6 Arch packages, the DTK2 Qt 6 port built on top of it,
# and the Qt 6 version probe, then pushes them to the GXDE Arch repo.  The DTK2
# Qt 6 port links against DTK6, so it comes after DTK6.  dtkcommon-git comes
# from the DTK5 batch and is installed from the GXDE Arch repo here.  Once
# everything is pushed, the applications linking against DTK6 or using Qt 6
# private API are rebuilt in turn.

name: Building GXDE DTK6 And DTK2 Qt6 Arch Packages
run-name: Building GXDE DTK6 And DTK2 Qt6 Arch Packages

on:
  workflow_dispatch:
    inputs:
      dtk6log:
        description: dtk6log branch or tag
        default: master
      dtk6core:
        description: dtk6core branch or tag
        default: master
      dtk6gui:
        description: dtk6gui branch or tag
        default: master
      dtk6widget:
        description: dtk6widget branch or tag
        default: master
      dtk6declarative:
        description: dtk6declarative branch or tag
        default: master
      dde_qt6platform_plugins:
        description: dde-qt6platform-plugins branch or tag
        default: master
      qt6integration:
        description: qt6integration branch or tag
        default: master
      dtk2widget_qt6:
        description: dtk2widget-qt6 branch or tag
        default: qt6
      gxde_qt6_integration:
        description: gxde-qt6-integration branch or tag
        default: qt6
      qt_probe:
        description: gxde-archpkg branch or tag for the Qt probe
        default: qt_version_probe
  # 供 Qt 版本巡检工作流调用 ・ Called by the Qt version watch workflow.
  workflow_call:
    inputs:
      dtk6log:
        description: dtk6log branch or tag
        type: string
        default: master
      dtk6core:
        description: dtk6core branch or tag
        type: string
        default: master
      dtk6gui:
        description: dtk6gui branch or tag
        type: string
        default: master
      dtk6widget:
        description: dtk6widget branch or tag
        type: string
        default: master
      dtk6declarative:
        description: dtk6declarative branch or tag
        type: string
        default: master
      dde_qt6platform_plugins:
        description: dde-qt6platform-plugins branch or tag
        type: string
        default: master
      qt6integration:
        description: qt6integration branch or tag
        type: string
        default: master
      dtk2widget_qt6:
        description: dtk2widget-qt6 branch or tag
        type: string
        default: qt6
      gxde_qt6_integration:
        description: gxde-qt6-integration branch or tag
        type: string
        default: qt6
      qt_probe:
        description: gxde-archpkg branch or tag for the Qt probe
        type: string
        default: qt_version_probe

jobs:
  build:
    uses: ./.github/workflows/building-arch-batch.yml
    secrets: inherit
    with:
      name: dtk6
      # 构建顺序即依赖顺序；Qt 探针随 DTK6 一起重建，使其编译时 Qt 版本与 DTK6 一致，
      # 且只推送 gxde-arch-qt-probe，以免影响另一个 Qt 主版本的巡检
      # Build order is dependency order.  The Qt probe is rebuilt alongside
      # DTK6 so its compile-time Qt matches the one DTK6 was built against,
      # and only gxde-arch-qt-probe is pushed so the other Qt major's watch
      # is left alone.
      modules: >-
        dtk6log:${{ inputs.dtk6log }}
        dtk6core:${{ inputs.dtk6core }}
        dtk6gui:${{ inputs.dtk6gui }}
        dtk6widget:${{ inputs.dtk6widget }}
        dtk6declarative:${{ inputs.dtk6declarative }}
        dde-qt6platform-plugins:${{ inputs.dde_qt6platform_plugins }}
        qt6integration:${{ inputs.qt6integration }}
        dtk2widget-qt6:${{ inputs.dtk2widget_qt6 }}
        gxde-qt6-integration:${{ inputs.gxde_qt6_integration }}
        gxde-archpkg:${{ inputs.qt_probe }}:gxde-arch-qt-probe

  # 等 DTK6 两个架构都推送成功后再开始，从 GXDE Arch 源取得刚发布的 DTK6
  # Starts only after DTK6 was pushed on both architectures, and picks the
  # fresh DTK6 up from the GXDE Arch repo.
  apps:
    needs: build
    uses: ./.github/workflows/building-arch-batch.yml
    secrets: inherit
    with:
      name: dtk6-apps
      # workflow_dispatch 最多 10 个输入，应用固定使用各自 Arch 包所在的分支；libgxmr-git 是 Qt5 版本，
      # 不随 DTK6 推送。gxde-movie-reborn 之后的应用使用了 Qt6 私有 API、QPA 或 Qt 私有头文件
      # （部分经 dtk2widget 的 qmake 模块间接引入），只在构建时的 Qt 小版本下可靠，Qt6 升级后同样需要重建；
      # libgxde-file-manager 还引用了 QObjectPrivate(QtPrivate_6_x_0)，只能在构建时的 Qt 小版本下加载
      # workflow_dispatch takes at most 10 inputs, so the applications always
      # build the branch carrying their Arch package.  libgxmr-git is the Qt 5
      # build and is left out of the DTK6 push.  The applications after
      # gxde-movie-reborn use Qt 6 private API, QPA or private Qt headers (some
      # through the qmake module of dtk2widget), which only hold for the Qt
      # minor release they were built against, so they are rebuilt on a Qt 6
      # update too; libgxde-file-manager even references
      # QObjectPrivate(QtPrivate_6_x_0) and only loads with that minor release.
      modules: >-
        xdg-desktop-portal-gxde:master
        gxde-movie-reborn:master:gxde-movie-git,libgxmr-qt6-git
        deepin-menu:master
        gxde-dock:master
        gxde-top-panel-plugins:d20
        gxde-control-center:master
        gxde-launcher:master
        gxde-terminal:dtk6
        deepin-screensaver:master
        gxde-file-manager:char/qt6_migration
        gxde-editor:master
        gxde-display-manager:main
        deepin-screen-recorder:master
        gxde-picker:master
        dde-clipboard:master
        gxde-calendar:master
        deepin-reader:master
        flake-wm:main
        gxde-boot-maker:master
        gxde-image-viewer:master
