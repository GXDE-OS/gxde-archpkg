# 每日检查 GXDE Arch 源中 DTK5 构建时所用的 qt5-base 是否仍与 Arch 上游一致，不一致时触发 DTK5 批量重建。
# -----------------------------------------------------------------------------
# Daily check that the qt5-base the GXDE Arch repo's DTK5 was built against
# still matches Arch upstream, triggering the DTK5 batch rebuild otherwise.

name: Watching Qt Version For DTK5
run-name: Watching Qt Version For DTK5

on:
  workflow_dispatch:
  schedule:
    - cron: "57 19 * * *"

jobs:
  watch:
    uses: ./.github/workflows/qt-watch-arch.yml
    with:
      probe_package: gxde-arch-qt5-probe
      probe_binary: gxde_arch_qt5_probe

  rebuild:
    needs: watch
    if: needs.watch.outputs.rebuild == 'true'
    uses: ./.github/workflows/building-dtk5.yml
    secrets: inherit
